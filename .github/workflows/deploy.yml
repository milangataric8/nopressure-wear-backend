name: Backend Deploy

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: "851587047309"
  ECR_REPOSITORY: nopressure-wear-backend
  EC2_INSTANCE_ID: i-0acf9766d7e56c606

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::851587047309:role/NoPressureWearGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build             -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"             -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest"             .

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy on EC2 through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command             --instance-ids "$EC2_INSTANCE_ID"             --document-name "AWS-RunShellScript"             --comment "Deploy NoPressureWear backend"             --parameters 'commands=["sudo -u ubuntu /home/ubuntu/nopressure-wear-backend/deploy.sh"]'             --region "$AWS_REGION"             --query "Command.CommandId"             --output text)

          echo "SSM command: $COMMAND_ID"

          set +e
          aws ssm wait command-executed             --command-id "$COMMAND_ID"             --instance-id "$EC2_INSTANCE_ID"             --region "$AWS_REGION"
          set -e

          aws ssm get-command-invocation             --command-id "$COMMAND_ID"             --instance-id "$EC2_INSTANCE_ID"             --region "$AWS_REGION"

          STATUS=$(aws ssm get-command-invocation             --command-id "$COMMAND_ID"             --instance-id "$EC2_INSTANCE_ID"             --region "$AWS_REGION"             --query "Status"             --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with SSM status: $STATUS"
            exit 1
          fi
