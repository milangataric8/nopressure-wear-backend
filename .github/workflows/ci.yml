name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nopressure_wear
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn clean verify -B
        env:
          SPRING_PROFILES_ACTIVE: ci

          # Baza (GitHub Actions postgres servis)
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nopressure_wear
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          DATABASE_URL: jdbc:postgresql://localhost:5432/nopressure_wear
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres

          # URL-ovi
          FRONTEND_URL: http://localhost:5173
          BASE_URL: http://localhost:8080

          # JWT (dummy, ali validne duzine - 256 bita)
          JWT_SECRET: dGVzdEp3dFNlY3JldEtleUZvckNJQnVpbGRzMzJCeXRlc0xvbmc=
          JWT_EXPIRATION: "86400000"

          # Mail (dummy - samo da se JavaMailSender bean kreira)
          MAIL_HOST: localhost
          MAIL_PORT: "2525"
          MAIL_USERNAME: test
          MAIL_PASSWORD: test

          # Eksterni servisi (dummy)
          CLOUDINARY_URL: cloudinary://123456789:testsecret@testcloud
          REMOVEBG_API_KEY: test-key
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret

          # Sentry iskljucen (prazno = off)
          SENTRY_DSN: ""

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
