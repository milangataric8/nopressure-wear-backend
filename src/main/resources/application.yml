spring:
  application:
    name: nopressure-wear-webshop

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    ignore-migration-patterns: "*:missing"

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

security:
  lockout:
    max-attempts: ${LOCKOUT_MAX_ATTEMPTS:5}
    lock-minutes: ${LOCKOUT_LOCK_MINUTES:15}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENV:local}
  release: ${SENTRY_RELEASE:dev}
  traces-sample-rate: 0.0
  send-default-pii: false
