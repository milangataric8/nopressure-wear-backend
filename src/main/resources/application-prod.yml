app:
  frontend-url: ${FRONTEND_URL}
  base-url: ${BASE_URL}
  upload:
    dir: ${UPLOAD_DIR:/data/uploads/products}
  cloudinary:
    folder: nopressure/products
  removebg:
    api-key: ${REMOVEBG_API_KEY}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  brevo:
    api-key: ${BREVO_API_KEY}
    sender-email: ${BREVO_SENDER_EMAIL}
    sender-name: ${BREVO_SENDER_NAME:NoPressure Wear}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: prod
  release: ${SENTRY_RELEASE:1.0.0}

email:
  retry:
    enabled: ${EMAIL_RETRY_ENABLED:true}
    max-attempts: ${EMAIL_RETRY_MAX_ATTEMPTS:5}
    interval-ms: ${EMAIL_RETRY_INTERVAL_MS:120000}
